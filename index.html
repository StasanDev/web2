<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Anime Echo — поиск цитат из аниме по сериалу или персонажу" />
  <meta name="theme-color" content="#0b0d14" />
  <title>Anime Echo — цитаты из аниме</title>
  <script type="module" src="/src/main.js"></script>
</head>

<body>
  <a class="skip-link" href="#main-content">Перейти к содержанию</a>

  <div class="ambient ambient--coral" aria-hidden="true"></div>
  <div class="ambient ambient--blue" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#top" aria-label="Anime Echo — на главную">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 44 44" role="img">
          <path
            d="M8 10.5h22.5A5.5 5.5 0 0 1 36 16v11a5.5 5.5 0 0 1-5.5 5.5H20L12.2 39v-6.5H8A5.5 5.5 0 0 1 2.5 27V16A5.5 5.5 0 0 1 8 10.5Z" />
          <path d="M12 19h15M12 25h10" />
        </svg>
      </span>
      <span>
        <strong>ANIME ECHO</strong>
        <small>quote archive</small>
      </span>
    </a>

    <a class="api-badge" href="https://animechan.io/docs" target="_blank" rel="noreferrer"
      aria-label="Открыть документацию Animechan API в новой вкладке">
      <span class="api-badge__dot" aria-hidden="true"></span>
      Animechan API
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M5 11 11 5M6 5h5v5" />
      </svg>
    </a>
  </header>

  <main id="main-content">
    <section class="hero" id="top" aria-labelledby="hero-title">
      <div class="hero__copy">
        <p class="eyebrow"><span>01</span> коллекция реплик</p>
        <h1 id="hero-title">
          Слова <br />для фарма<br /><em>ауры.</em>
        </h1>
        <p class="hero__lead">
          Ищите цитаты по названию аниме или имени персонажа — без регистрации и лишнего шума.
        </p>

        <div class="hero__facts" aria-label="О проекте">
          <div>
            <strong>2 режима</strong>
            <span>аниме / персонаж</span>
          </div>
        </div>
      </div>

      <article class="featured-card" aria-labelledby="random-heading">
        <div class="featured-card__topline">
          <div>
            <h2 id="random-heading">Случайная реплика</h2>
          </div>
          <span class="featured-card__index" aria-hidden="true">#∞</span>
        </div>

        <div class="featured-card__content" id="featured-content" aria-live="polite" aria-busy="true"></div>

        <div class="featured-card__error" id="featured-error" role="alert" hidden>
          <p id="featured-error-message"></p>
          <button class="text-button" id="featured-retry" type="button">Повторить</button>
        </div>

        <div class="featured-card__footer">
          <p>Каждый запрос — новая сцена.</p>
          <button class="round-button" id="random-button" type="button" aria-label="Показать другую случайную цитату">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v6h-6" />
            </svg>
          </button>
        </div>
      </article>
    </section>
  </main>
</body>

</html>
